<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no">

    <title>Flappy Bird</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg, #172554, #263238, #0f766e
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            position: relative;
            width: min(100vw, 1000px);
            aspect-ratio: 5 / 4;
            overflow: hidden;

            border: 3px solid white;
            border-radius: 12px;

            box-shadow: 0 0 35px
                rgba(0, 255, 200, 0.25);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
        }

        .fullscreen-btn,
        .music-btn {
            position: absolute;
            top: 12px;
            z-index: 5;

            color: white;
            background: rgba(20, 35, 45, 0.75);
            border: 1px solid rgba(255,255,255,0.65);
            border-radius: 10px;

            padding: 10px 13px;
            font-size: 18px;
            cursor: pointer;
        }

        .fullscreen-btn {
            right: 12px;
        }

        .music-btn {
            left: 12px;
        }

        button:active {
            transform: scale(0.95);
        }

        .game-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            aspect-ratio: auto;
            border: none;
            border-radius: 0;
            box-shadow: none;
            background: #70C5CE;
        }

        .game-container:fullscreen canvas {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 600px) {
            .game-container {
                border-width: 1px;
                border-radius: 5px;
            }

            .fullscreen-btn,
            .music-btn {
                top: 8px;
                padding: 8px 10px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="game-container" id="gameContainer">

    <canvas id="game" width="1000" height="800"></canvas>

    <button class="music-btn" id="musicButton"
            aria-label="Toggle music">♫</button>

    <button class="fullscreen-btn" id="fullscreenButton"
            aria-label="Toggle fullscreen">⛶</button>

</div>

<script>
    // =========================
    // CANVAS
    // =========================

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const container = document.getElementById("gameContainer");
    const fullscreenButton =
        document.getElementById("fullscreenButton");
    const musicButton =
        document.getElementById("musicButton");

    const WIDTH = 1000;
    const HEIGHT = 800;

    // =========================
    // GAME SETTINGS
    // =========================

    const GRAVITY = 0.5;
    const JUMP_STRENGTH = -9;
    const PIPE_SPEED = 3;

    const BIRD_X = 180;
    const BIRD_SIZE = 34;

    const PIPE_WIDTH = 75;
    const PIPE_GAP = 190;
    const GROUND_HEIGHT = 70;

    // =========================
    // COLORS
    // =========================

    const WHITE = "#FFFFFF";
    const DARK = "#263238";
    const YELLOW = "#FFD93D";
    const ORANGE = "#F4A261";
    const GRASS = "#5DBB63";
    const GROUND = "#DED895";
    const PIPE_DARK = "#277A35";

    // =========================
    // GAME VARIABLES
    // =========================

    let birdY = HEIGHT / 2;
    let birdVelocity = 0;

    let pipes = [];
    let score = 0;
    let bestScore = 0;

    let running = false;
    let gameOver = false;

    let animationId = null;
    let lastTime = 0;

    // =========================
    // RESPONSIVE DISPLAY
    // =========================

    // Canvas drawing uses 1000 x 800 logical coordinates.
    // CSS automatically scales it to the screen.

    function resizeGame() {
        // Keep the drawing resolution unchanged.
        // CSS resizes the frame for each device.
        canvas.style.width = "100%";
        canvas.style.height = "100%";
    }

    window.addEventListener("resize", resizeGame);

    window.addEventListener("orientationchange", () => {
        setTimeout(resizeGame, 100);
    });

    resizeGame();

    // =========================
    // FULLSCREEN
    // =========================

    async function toggleFullscreen() {
        try {
            if (!document.fullscreenElement) {
                await container.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch (error) {
            console.log("Fullscreen is unavailable:", error);
        }
    }

    fullscreenButton.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleFullscreen();
    });

    document.addEventListener("fullscreenchange", () => {
        fullscreenButton.textContent =
            document.fullscreenElement ? "✕" : "⛶";

        resizeGame();
    });

    // =========================
    // BACKGROUND
    // =========================

    function drawCloud(x, y, scale = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        ctx.fillStyle = "rgba(255,255,255,0.85)";

        ctx.beginPath();
        ctx.arc(0, 0, 30, 0, Math.PI * 2);
        ctx.arc(35, -20, 38, 0, Math.PI * 2);
        ctx.arc(70, 0, 30, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawBackground() {
        const sky = ctx.createLinearGradient(
            0, 0, 0, HEIGHT
        );

        sky.addColorStop(0, "#55CBE5");
        sky.addColorStop(1, "#B5F3F5");

        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Sun
        ctx.fillStyle = "#FFF4A3";
        ctx.beginPath();
        ctx.arc(830, 120, 55, 0, Math.PI * 2);
        ctx.fill();

        // Clouds
        drawCloud(100, 120, 1);
        drawCloud(620, 180, 0.9);
        drawCloud(380, 270, 0.7);

        // Distant hills
        ctx.fillStyle = "#86D6A0";
        ctx.beginPath();
        ctx.moveTo(0, 680);
        ctx.quadraticCurveTo(200, 570, 400, 730);
        ctx.quadraticCurveTo(650, 560, 850, 730);
        ctx.lineTo(WIDTH, 730);
        ctx.lineTo(WIDTH, HEIGHT);
        ctx.lineTo(0, HEIGHT);
        ctx.fill();

        // Ground
        ctx.fillStyle = GROUND;
        ctx.fillRect(
            0, HEIGHT - GROUND_HEIGHT,
            WIDTH, GROUND_HEIGHT
        );

        // Grass
        ctx.fillStyle = GRASS;
        ctx.fillRect(
            0, HEIGHT - GROUND_HEIGHT,
            WIDTH, 15
        );

        // Ground decoration
        ctx.fillStyle = "#C7BD77";

        for (let x = 0; x < WIDTH; x += 45) {
            ctx.fillRect(x, HEIGHT - 35, 22, 4);
        }
    }

    // =========================
    // BIRD
    // =========================

    function drawBird(x, y) {
        ctx.save();

        const angle = Math.max(
            -0.35,
            Math.min(0.7, birdVelocity * 0.045)
        );

        ctx.translate(x, y);
        ctx.rotate(angle);

        // Body
        ctx.fillStyle = YELLOW;
        ctx.strokeStyle = "#D9A900";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.ellipse(
            0, 0, BIRD_SIZE / 2,
            BIRD_SIZE / 2, 0, 0, Math.PI * 2
        );
        ctx.fill();
        ctx.stroke();

        // Wing
        ctx.fillStyle = ORANGE;

        ctx.beginPath();
        ctx.ellipse(-6, 7, 9, 5.5, 0,
                    0, Math.PI * 2);
        ctx.fill();

        // Eye
        ctx.fillStyle = WHITE;

        ctx.beginPath();
        ctx.arc(10, -7, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = DARK;

        ctx.beginPath();
        ctx.arc(12, -7, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = "#FF7043";

        ctx.beginPath();
        ctx.moveTo(14, -2);
        ctx.lineTo(29, 4);
        ctx.lineTo(14, 8);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    // =========================
    // PIPES
    // =========================

    function createPipe(x) {
        const minCenter = 190;
        const maxCenter = HEIGHT - GROUND_HEIGHT - 190;

        const gapCenter = Math.floor(
            Math.random() * (maxCenter - minCenter)
            + minCenter
        );

        pipes.push({
            x: x,
            gapCenter: gapCenter,
            passed: false
        });
    }

    function drawPipe(pipe) {
        const x = pipe.x;

        const topHeight =
            pipe.gapCenter - PIPE_GAP / 2;

        const bottomY =
            pipe.gapCenter + PIPE_GAP / 2;

        const bottomHeight =
            HEIGHT - GROUND_HEIGHT - bottomY;

        const gradient = ctx.createLinearGradient(
            x, 0, x + PIPE_WIDTH, 0
        );

        gradient.addColorStop(0, "#2E8B3C");
        gradient.addColorStop(0.5, "#72D572");
        gradient.addColorStop(1, "#258038");

        ctx.fillStyle = gradient;
        ctx.strokeStyle = PIPE_DARK;
        ctx.lineWidth = 3;

        // Top pipe
        ctx.fillRect(x, 0, PIPE_WIDTH, topHeight);
        ctx.strokeRect(x, 0, PIPE_WIDTH, topHeight);

        // Top lip
        ctx.fillRect(
            x - 5, topHeight - 20,
            PIPE_WIDTH + 10, 20
        );

        ctx.strokeRect(
            x - 5, topHeight - 20,
            PIPE_WIDTH + 10, 20
        );

        // Bottom pipe
        ctx.fillRect(
            x, bottomY, PIPE_WIDTH, bottomHeight
        );

        ctx.strokeRect(
            x, bottomY, PIPE_WIDTH, bottomHeight
        );

        // Bottom lip
        ctx.fillRect(
            x - 5, bottomY,
            PIPE_WIDTH + 10, 20
        );

        ctx.strokeRect(
            x - 5, bottomY,
            PIPE_WIDTH + 10, 20
        );
    }

    // =========================
    // SCORE
    // =========================

    function drawScore() {
        ctx.textAlign = "center";
        ctx.font = "bold 46px Arial";
        ctx.lineWidth = 5;
        ctx.strokeStyle = "rgba(0,0,0,0.3)";

        ctx.strokeText(score, WIDTH / 2, 75);

        ctx.fillStyle = WHITE;
        ctx.fillText(score, WIDTH / 2, 75);
    }

    // =========================
    // START SCREEN
    // Only the game title is shown.
    // =========================

    function showStartScreen() {
        drawBackground();
        drawBird(BIRD_X, birdY);

        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Soft title shadow
        ctx.shadowColor = "rgba(0,0,0,0.35)";
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 5;

        ctx.font = "bold 70px Arial";
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#D98C00";
        ctx.strokeText(
            "FLAPPY BIRD", WIDTH / 2, HEIGHT / 2
        );

        ctx.fillStyle = YELLOW;
        ctx.fillText(
            "FLAPPY BIRD", WIDTH / 2, HEIGHT / 2
        );

        ctx.restore();
    }

    // =========================
    // BACKGROUND MUSIC
    // Generated with Web Audio API.
    // No external audio file required.
    // =========================

    let audioContext = null;
    let musicTimer = null;
    let musicEnabled = true;
    let musicStep = 0;

    const melody = [
        523.25, 659.25, 783.99, 659.25,
        587.33, 698.46, 880.00, 698.46,
        523.25, 659.25, 783.99, 1046.50,
        880.00, 783.99, 659.25, 587.33
    ];

    const bassNotes = [
        130.81, 130.81, 164.81, 164.81,
        146.83, 146.83, 174.61, 174.61
    ];

    function playTone(
        frequency, duration, volume, waveform = "sine"
    ) {
        if (!audioContext || !musicEnabled) return;

        const now = audioContext.currentTime;

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = waveform;
        oscillator.frequency.setValueAtTime(
            frequency, now
        );

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(
            volume, now + 0.025
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001, now + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(now);
        oscillator.stop(now + duration + 0.03);
    }

    function playMusicBeat() {
        if (!audioContext || !musicEnabled) return;

        const note = melody[musicStep % melody.length];

        // Bright, cheerful melody
        playTone(note, 0.23, 0.045, "sine");

        // Gentle bass accompaniment
        if (musicStep % 2 === 0) {
            const bass =
                bassNotes[musicStep % bassNotes.length];

            playTone(bass, 0.42, 0.035, "triangle");
        }

        // Soft high note for a magical feel
        if (musicStep % 4 === 2) {
            playTone(note * 2, 0.16, 0.012, "sine");
        }

        musicStep++;
    }

    async function startMusic() {
        if (!musicEnabled) return;

        try {
            if (!audioContext) {
                const AudioContextClass =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (!AudioContextClass) return;

                audioContext = new AudioContextClass();
            }

            if (audioContext.state === "suspended") {
                await audioContext.resume();
            }

            if (musicTimer === null) {
                playMusicBeat();

                musicTimer = setInterval(
                    playMusicBeat, 260
                );
            }
        } catch (error) {
            console.log("Audio unavailable:", error);
        }
    }

    function stopMusic() {
        if (musicTimer !== null) {
            clearInterval(musicTimer);
            musicTimer = null;
        }
    }

    musicButton.addEventListener("click", async (event) => {
        event.stopPropagation();

        musicEnabled = !musicEnabled;

        if (musicEnabled) {
            musicButton.textContent = "♫";
            await startMusic();
        } else {
            musicButton.textContent = "♪̸";
            stopMusic();
        }
    });

    // =========================
    // START / RESTART GAME
    // =========================

    async function startGame() {
        if (animationId !== null) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }

        score = 0;
        birdY = HEIGHT / 2;
        birdVelocity = 0;
        pipes = [];

        createPipe(WIDTH + 150);
        createPipe(WIDTH + 500);

        running = true;
        gameOver = false;
        lastTime = 0;

        await startMusic();

        animationId = requestAnimationFrame(gameLoop);
    }

    // =========================
    // FLAP
    // =========================

    function flap(event) {
        if (event) {
            event.preventDefault();
        }

        if (!running) {
            startGame();
            birdVelocity = JUMP_STRENGTH;
            return;
        }

        birdVelocity = JUMP_STRENGTH;
    }

    // =========================
    // COLLISION DETECTION
    // =========================

    function checkCollision() {
        const birdLeft = BIRD_X - BIRD_SIZE / 2;
        const birdRight = BIRD_X + BIRD_SIZE / 2;
        const birdTop = birdY - BIRD_SIZE / 2;
        const birdBottom = birdY + BIRD_SIZE / 2;

        // Ceiling and ground
        if (birdTop <= 0) return true;

        if (birdBottom >= HEIGHT - GROUND_HEIGHT) {
            return true;
        }

        // Pipes
        for (const pipe of pipes) {
            const pipeLeft = pipe.x;
            const pipeRight = pipe.x + PIPE_WIDTH;

            if (
                birdRight > pipeLeft &&
                birdLeft < pipeRight
            ) {
                const gapTop =
                    pipe.gapCenter - PIPE_GAP / 2;

                const gapBottom =
                    pipe.gapCenter + PIPE_GAP / 2;

                if (
                    birdTop < gapTop ||
                    birdBottom > gapBottom
                ) {
                    return true;
                }
            }
        }

        return false;
    }

    // =========================
    // GAME OVER
    // =========================

    function endGame() {
        running = false;
        gameOver = true;

        if (score > bestScore) {
            bestScore = score;
        }

        drawBackground();

        for (const pipe of pipes) {
            drawPipe(pipe);
        }

        drawBird(BIRD_X, birdY);
        drawScore();

        const boxWidth = 500;
        const boxHeight = 300;

        const boxLeft = (WIDTH - boxWidth) / 2;
        const boxTop = (HEIGHT - boxHeight) / 2;

        ctx.fillStyle = "rgba(38,50,56,0.96)";
        ctx.strokeStyle = WHITE;
        ctx.lineWidth = 3;

        ctx.fillRect(
            boxLeft, boxTop, boxWidth, boxHeight
        );

        ctx.strokeRect(
            boxLeft, boxTop, boxWidth, boxHeight
        );

        ctx.textAlign = "center";

        ctx.fillStyle = "#FF5252";
        ctx.font = "bold 42px Arial";
        ctx.fillText(
            "GAME OVER", WIDTH / 2, boxTop + 60
        );

        ctx.fillStyle = WHITE;
        ctx.font = "bold 27px Arial";
        ctx.fillText(
            "Score: " + score,
            WIDTH / 2, boxTop + 125
        );

        ctx.fillStyle = YELLOW;
        ctx.font = "bold 23px Arial";
        ctx.fillText(
            "Best: " + bestScore,
            WIDTH / 2, boxTop + 175
        );

        ctx.fillStyle = WHITE;
        ctx.font = "bold 18px Arial";
        ctx.fillText(
            "SPACE / CLICK TO PLAY AGAIN",
            WIDTH / 2, boxTop + 240
        );

        animationId = null;
    }

    // =========================
    // MAIN GAME LOOP
    // =========================

    function gameLoop(timestamp) {
        if (!running) return;

        if (lastTime === 0) {
            lastTime = timestamp;
        }

        // Normalize movement for different refresh rates
        const deltaTime = Math.min(
            (timestamp - lastTime) / 16.667,
            2
        );

        lastTime = timestamp;

        // Bird movement
        birdVelocity += GRAVITY * deltaTime;
        birdY += birdVelocity * deltaTime;

        // Pipe movement
        for (const pipe of pipes) {
            pipe.x -= PIPE_SPEED * deltaTime;
        }

        // Create new pipes
        if (
            pipes.length > 0 &&
            pipes[pipes.length - 1].x < WIDTH - 350
        ) {
            createPipe(WIDTH);
        }

        // Remove pipes outside screen
        pipes = pipes.filter(
            pipe => pipe.x > -PIPE_WIDTH - 20
        );

        // Score
        for (const pipe of pipes) {
            if (
                !pipe.passed &&
                pipe.x + PIPE_WIDTH < BIRD_X
            ) {
                pipe.passed = true;
                score++;
            }
        }

        drawBackground();

        for (const pipe of pipes) {
            drawPipe(pipe);
        }

        drawBird(BIRD_X, birdY);
        drawScore();

        if (checkCollision()) {
            endGame();
            return;
        }

        animationId = requestAnimationFrame(gameLoop);
    }

    // =========================
    // KEYBOARD CONTROLS
    // =========================

    document.addEventListener("keydown", event => {
        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {
            event.preventDefault();

            if (!event.repeat) {
                flap();
            }
        }

        if (event.code === "Enter" && !running) {
            startGame();
        }

        // F key toggles fullscreen
        if (event.code === "KeyF") {
            toggleFullscreen();
        }
    });

    // =========================
    // MOUSE AND TOUCH
    // =========================

    canvas.addEventListener("pointerdown", flap);

    // =========================
    // INITIALIZE
    // =========================

    showStartScreen();

</script>

</body>
</html>
