<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Medium Speed</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172554, #263238, #0f766e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-container {
            width: 1000px;
            max-width: 100%;
            overflow: hidden;
            border: 4px solid white;
            border-radius: 14px;
            box-shadow: 0 0 35px rgba(0, 255, 200, 0.25);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #70C5CE;
            cursor: pointer;
            touch-action: manipulation;
        }

        @media (max-width: 600px) {
            .game-container {
                border-width: 2px;
            }
        }
    </style>
</head>

<body>

<div class="game-container">
    <canvas id="game" width="1000" height="800"></canvas>
</div>

<script>
    // =========================
    // GAME SETTINGS
    // =========================

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const WIDTH = 1000;
    const HEIGHT = 800;

    // Medium-speed settings
    const GRAVITY = 0.5;
    const JUMP_STRENGTH = -9;
    const PIPE_SPEED = 3;

    const BIRD_X = 180;
    const BIRD_SIZE = 34;

    const PIPE_WIDTH = 75;
    const PIPE_GAP = 190;
    const GROUND_HEIGHT = 70;

    // =========================
    // COLORS
    // =========================

    const SKY = "#70C5CE";
    const GROUND = "#DED895";
    const GRASS = "#5DBB63";
    const PIPE_GREEN = "#4CAF50";
    const PIPE_DARK = "#277A35";
    const YELLOW = "#FFD93D";
    const ORANGE = "#F4A261";
    const WHITE = "#FFFFFF";
    const DARK = "#263238";

    // =========================
    // GAME VARIABLES
    // =========================

    let birdY = HEIGHT / 2;
    let birdVelocity = 0;

    let pipes = [];
    let score = 0;
    let bestScore = 0;

    let running = false;
    let gameOver = false;
    let started = false;

    let animationId = null;
    let lastTime = 0;

    // =========================
    // BACKGROUND
    // =========================

    function drawBackground() {
        const skyGradient = ctx.createLinearGradient(
            0, 0, 0, HEIGHT
        );

        skyGradient.addColorStop(0, "#55CBE5");
        skyGradient.addColorStop(1, "#B5F3F5");

        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Sun
        ctx.fillStyle = "#FFF4A3";
        ctx.beginPath();
        ctx.arc(830, 120, 55, 0, Math.PI * 2);
        ctx.fill();

        // Clouds
        drawCloud(150, 110);
        drawCloud(670, 180);
        drawCloud(430, 270);

        // Distant hills
        ctx.fillStyle = "#86D6A0";
        ctx.beginPath();
        ctx.moveTo(0, HEIGHT - GROUND_HEIGHT);
        ctx.quadraticCurveTo(200, 570, 400, 730);
        ctx.quadraticCurveTo(650, 560, 850, 730);
        ctx.lineTo(WIDTH, 730);
        ctx.lineTo(WIDTH, HEIGHT);
        ctx.lineTo(0, HEIGHT);
        ctx.fill();

        // Ground
        ctx.fillStyle = GROUND;
        ctx.fillRect(
            0,
            HEIGHT - GROUND_HEIGHT,
            WIDTH,
            GROUND_HEIGHT
        );

        // Grass
        ctx.fillStyle = GRASS;
        ctx.fillRect(
            0,
            HEIGHT - GROUND_HEIGHT,
            WIDTH,
            15
        );

        // Ground details
        ctx.fillStyle = "#C7BD77";

        for (let x = 0; x < WIDTH; x += 45) {
            ctx.fillRect(x, HEIGHT - 35, 22, 4);
        }
    }

    function drawCloud(x, y) {
        ctx.fillStyle = "rgba(255,255,255,0.85)";

        ctx.beginPath();
        ctx.arc(x, y, 30, 0, Math.PI * 2);
        ctx.arc(x + 35, y - 20, 38, 0, Math.PI * 2);
        ctx.arc(x + 70, y, 30, 0, Math.PI * 2);
        ctx.fill();
    }

    // =========================
    // DRAW BIRD
    // =========================

    function drawBird(x, y) {
        ctx.save();

        // Rotate bird according to movement
        const angle = Math.max(
            -0.35,
            Math.min(0.7, birdVelocity * 0.045)
        );

        ctx.translate(x, y);
        ctx.rotate(angle);

        // Body
        ctx.fillStyle = YELLOW;
        ctx.strokeStyle = "#D9A900";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.ellipse(
            0, 0,
            BIRD_SIZE / 2,
            BIRD_SIZE / 2,
            0, 0, Math.PI * 2
        );
        ctx.fill();
        ctx.stroke();

        // Wing
        ctx.fillStyle = ORANGE;

        ctx.beginPath();
        ctx.ellipse(
            -6, 7,
            9, 5.5,
            0, 0, Math.PI * 2
        );
        ctx.fill();

        // Eye
        ctx.fillStyle = WHITE;

        ctx.beginPath();
        ctx.arc(10, -7, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = DARK;

        ctx.beginPath();
        ctx.arc(12, -7, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = "#FF7043";

        ctx.beginPath();
        ctx.moveTo(14, -2);
        ctx.lineTo(29, 4);
        ctx.lineTo(14, 8);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    // =========================
    // CREATE PIPES
    // =========================

    function createPipe(x) {
        const minCenter = 190;
        const maxCenter = HEIGHT - GROUND_HEIGHT - 190;

        const gapCenter = Math.floor(
            Math.random() * (maxCenter - minCenter) + minCenter
        );

        pipes.push({
            x: x,
            gapCenter: gapCenter,
            passed: false
        });
    }

    // =========================
    // DRAW PIPES
    // =========================

    function drawPipe(pipe) {
        const x = pipe.x;

        const topHeight =
            pipe.gapCenter - PIPE_GAP / 2;

        const bottomY =
            pipe.gapCenter + PIPE_GAP / 2;

        const bottomHeight =
            HEIGHT - GROUND_HEIGHT - bottomY;

        // Pipe gradient
        const pipeGradient = ctx.createLinearGradient(
            x, 0, x + PIPE_WIDTH, 0
        );

        pipeGradient.addColorStop(0, "#2E8B3C");
        pipeGradient.addColorStop(0.5, "#72D572");
        pipeGradient.addColorStop(1, "#258038");

        ctx.fillStyle = pipeGradient;
        ctx.strokeStyle = PIPE_DARK;
        ctx.lineWidth = 3;

        // Top pipe
        ctx.fillRect(x, 0, PIPE_WIDTH, topHeight);
        ctx.strokeRect(x, 0, PIPE_WIDTH, topHeight);

        // Top lip
        ctx.fillRect(
            x - 5,
            topHeight - 20,
            PIPE_WIDTH + 10,
            20
        );

        ctx.strokeRect(
            x - 5,
            topHeight - 20,
            PIPE_WIDTH + 10,
            20
        );

        // Bottom pipe
        ctx.fillRect(
            x,
            bottomY,
            PIPE_WIDTH,
            bottomHeight
        );

        ctx.strokeRect(
            x,
            bottomY,
            PIPE_WIDTH,
            bottomHeight
        );

        // Bottom lip
        ctx.fillRect(
            x - 5,
            bottomY,
            PIPE_WIDTH + 10,
            20
        );

        ctx.strokeRect(
            x - 5,
            bottomY,
            PIPE_WIDTH + 10,
            20
        );
    }

    // =========================
    // SCORE
    // =========================

    function drawScore() {
        ctx.textAlign = "center";
        ctx.font = "bold 46px Arial";

        ctx.lineWidth = 5;
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.strokeText(score, WIDTH / 2, 75);

        ctx.fillStyle = WHITE;
        ctx.fillText(score, WIDTH / 2, 75);
    }

    // =========================
    // START SCREEN
    // =========================

    function showStartScreen() {
        drawBackground();
        drawBird(BIRD_X, birdY);
        drawScore();

        ctx.textAlign = "center";

        ctx.fillStyle = "rgba(38,50,56,0.85)";
        ctx.fillRect(180, 245, 640, 200);

        ctx.strokeStyle = WHITE;
        ctx.lineWidth = 3;
        ctx.strokeRect(180, 245, 640, 200);

        ctx.fillStyle = "#FFD93D";
        ctx.font = "bold 52px Arial";
        ctx.fillText("FLAPPY BIRD", WIDTH / 2, 310);

        ctx.fillStyle = WHITE;
        ctx.font = "bold 22px Arial";
        ctx.fillText(
            "MEDIUM SPEED MODE",
            WIDTH / 2, 355
        );

        ctx.font = "20px Arial";
        ctx.fillText(
            "PRESS SPACE OR CLICK TO START",
            WIDTH / 2, 405
        );
    }

    // =========================
    // START / RESTART GAME
    // =========================

    function startGame() {
        if (animationId !== null) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }

        score = 0;
        birdY = HEIGHT / 2;
        birdVelocity = 0;
        pipes = [];

        createPipe(WIDTH + 150);
        createPipe(WIDTH + 500);

        running = true;
        gameOver = false;
        started = true;

        lastTime = 0;

        animationId = requestAnimationFrame(gameLoop);
    }

    // =========================
    // BIRD FLAP
    // =========================

    function flap(event) {
        if (event) {
            event.preventDefault();
        }

        if (!running) {
            startGame();
        }

        birdVelocity = JUMP_STRENGTH;
    }

    // =========================
    // COLLISION DETECTION
    // =========================

    function checkCollision() {
        const birdLeft = BIRD_X - BIRD_SIZE / 2;
        const birdRight = BIRD_X + BIRD_SIZE / 2;

        const birdTop = birdY - BIRD_SIZE / 2;
        const birdBottom = birdY + BIRD_SIZE / 2;

        // Ceiling
        if (birdTop <= 0) {
            return true;
        }

        // Ground
        if (birdBottom >= HEIGHT - GROUND_HEIGHT) {
            return true;
        }

        // Pipes
        for (const pipe of pipes) {
            const pipeLeft = pipe.x;
            const pipeRight = pipe.x + PIPE_WIDTH;

            if (
                birdRight > pipeLeft &&
                birdLeft < pipeRight
            ) {
                const gapTop =
                    pipe.gapCenter - PIPE_GAP / 2;

                const gapBottom =
                    pipe.gapCenter + PIPE_GAP / 2;

                if (
                    birdTop < gapTop ||
                    birdBottom > gapBottom
                ) {
                    return true;
                }
            }
        }

        return false;
    }

    // =========================
    // GAME OVER SCREEN
    // =========================

    function endGame() {
        running = false;
        gameOver = true;

        if (score > bestScore) {
            bestScore = score;
        }

        drawBackground();

        for (const pipe of pipes) {
            drawPipe(pipe);
        }

        drawBird(BIRD_X, birdY);
        drawScore();

        // Game-over panel
        const boxWidth = 500;
        const boxHeight = 300;

        const boxLeft = (WIDTH - boxWidth) / 2;
        const boxTop = (HEIGHT - boxHeight) / 2;

        ctx.fillStyle = "rgba(38,50,56,0.96)";
        ctx.strokeStyle = WHITE;
        ctx.lineWidth = 3;

        ctx.fillRect(
            boxLeft, boxTop,
            boxWidth, boxHeight
        );

        ctx.strokeRect(
            boxLeft, boxTop,
            boxWidth, boxHeight
        );

        ctx.textAlign = "center";

        ctx.fillStyle = "#FF5252";
        ctx.font = "bold 42px Arial";
        ctx.fillText(
            "GAME OVER",
            WIDTH / 2, boxTop + 60
        );

        ctx.fillStyle = WHITE;
        ctx.font = "bold 27px Arial";
        ctx.fillText(
            "Score: " + score,
            WIDTH / 2, boxTop + 125
        );

        ctx.fillStyle = "#FFD54F";
        ctx.font = "bold 23px Arial";
        ctx.fillText(
            "Best: " + bestScore,
            WIDTH / 2, boxTop + 175
        );

        ctx.fillStyle = WHITE;
        ctx.font = "bold 18px Arial";
        ctx.fillText(
            "SPACE / CLICK TO PLAY AGAIN",
            WIDTH / 2, boxTop + 240
        );

        animationId = null;
    }

    // =========================
    // MAIN GAME LOOP
    // =========================

    function gameLoop(timestamp) {
        if (!running) {
            return;
        }

        // Keep game speed consistent across screen refresh rates.
        if (lastTime === 0) {
            lastTime = timestamp;
        }

        const deltaTime = Math.min(
            (timestamp - lastTime) / 16.667,
            2
        );

        lastTime = timestamp;

        // Bird physics
        birdVelocity += GRAVITY * deltaTime;
        birdY += birdVelocity * deltaTime;

        // Move pipes at medium speed
        for (const pipe of pipes) {
            pipe.x -= PIPE_SPEED * deltaTime;
        }

        // Create new pipes
        if (
            pipes.length > 0 &&
            pipes[pipes.length - 1].x < WIDTH - 350
        ) {
            createPipe(WIDTH);
        }

        // Remove old pipes
        pipes = pipes.filter(
            pipe => pipe.x > -PIPE_WIDTH - 20
        );

        // Update score
        for (const pipe of pipes) {
            if (
                !pipe.passed &&
                pipe.x + PIPE_WIDTH < BIRD_X
            ) {
                pipe.passed = true;
                score++;
            }
        }

        // Draw everything
        drawBackground();

        for (const pipe of pipes) {
            drawPipe(pipe);
        }

        drawBird(BIRD_X, birdY);
        drawScore();

        // Collision detection
        if (checkCollision()) {
            endGame();
            return;
        }

        animationId = requestAnimationFrame(gameLoop);
    }

    // =========================
    // KEYBOARD CONTROLS
    // =========================

    document.addEventListener("keydown", function(event) {
        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {
            event.preventDefault();

            // Prevent holding the key from auto-flapping
            if (!event.repeat) {
                flap();
            }
        }

        if (event.code === "Enter" && !running) {
            startGame();
        }
    });

    // =========================
    // MOUSE / TOUCH CONTROLS
    // =========================

    canvas.addEventListener("pointerdown", flap);

    // =========================
    // INITIALIZE GAME
    // =========================

    showStartScreen();

</script>

</body>
</html>
